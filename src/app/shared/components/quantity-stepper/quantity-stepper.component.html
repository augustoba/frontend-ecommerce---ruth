<div class="inline-flex items-center border border-stone-200 rounded-full overflow-hidden">
  <button
    type="button"
    (click)="decrement()"
    [disabled]="quantity() <= min()"
    class="w-8 h-8 flex items-center justify-center text-stone-600 font-bold hover:bg-brand-50 disabled:opacity-30 disabled:hover:bg-transparent transition-colors"
    aria-label="Restar cantidad"
  >
    −
  </button>
  <span class="w-8 text-center font-semibold text-stone-800 select-none">{{ quantity() }}</span>
  <button
    type="button"
    (click)="increment()"
    [disabled]="quantity() >= max()"
    class="w-8 h-8 flex items-center justify-center text-stone-600 font-bold hover:bg-brand-50 disabled:opacity-30 disabled:hover:bg-transparent transition-colors"
    aria-label="Sumar cantidad"
  >
    +
  </button>
</div>
