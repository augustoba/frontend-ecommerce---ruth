<a
  [routerLink]="['/producto', product().id]"
  class="group flex flex-col bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-lg ring-1 ring-black/5 transition-shadow"
>
  <div class="relative aspect-[4/5] overflow-hidden bg-brand-100">
    <img
      [src]="product().imageUrl | cldImg: 400"
      [alt]="product().name"
      loading="lazy"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
    />
    @if (categoryLabel) {
      <span
        class="absolute top-2 left-2 bg-white/90 text-brand-600 text-xs font-bold px-2 py-1 rounded-full"
      >
        {{ categoryLabel }}
      </span>
    }
    @if (outOfStock) {
      <span
        class="absolute inset-0 bg-stone-900/50 flex items-center justify-center text-white font-bold text-sm tracking-wide"
      >
        Sin stock
      </span>
    } @else if (lowStockLabel) {
      <span
        class="absolute bottom-2 left-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full"
      >
        {{ lowStockLabel }}
      </span>
    }
  </div>

  <div class="p-4 flex flex-col gap-1 flex-1">
    <h3 class="font-semibold text-stone-800 line-clamp-2 leading-snug">{{ product().name }}</h3>
    <p class="text-xs text-stone-500">{{ product().ageRange }}</p>
    <p class="mt-auto pt-2 font-display font-bold text-lg text-brand-600">
      {{ product().price | currency: 'ARS' : 'symbol' : '1.0-0' }}
    </p>
  </div>
</a>
