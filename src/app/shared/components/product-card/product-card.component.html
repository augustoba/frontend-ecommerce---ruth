<a [routerLink]="['/producto', product().id]" [class]="c().root">
  <div [class]="c().media">
    <img
      [src]="product().imageUrl | cldImg: 400"
      [alt]="product().name"
      loading="lazy"
      [class]="c().img"
    />
    @if (categoryLabel) {
      <span [class]="c().badge">
        {{ categoryLabel }}
      </span>
    }
    @if (outOfStock) {
      <span
        class="absolute inset-0 bg-stone-900/50 flex items-center justify-center text-white font-bold text-sm tracking-wide"
      >
        Sin stock
      </span>
    } @else if (lowStockLabel) {
      <span
        class="absolute bottom-2 left-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full"
      >
        {{ lowStockLabel }}
      </span>
    }
  </div>

  <div [class]="c().body">
    <h3 [class]="c().name">{{ product().name }}</h3>
    <p [class]="c().age">{{ product().ageRange }}</p>
    <p [class]="c().price">
      {{ product().price | currency: 'ARS' : 'symbol' : '1.0-0' }}
    </p>
  </div>
</a>
