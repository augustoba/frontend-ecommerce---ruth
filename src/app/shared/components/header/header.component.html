<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-brand-100 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
    <a routerLink="/" class="flex items-center gap-2 shrink-0">
      <img src="logo.jpeg" [alt]="storeName()" class="h-11 w-11 rounded-full object-cover ring-1 ring-brand-100" />
      <span class="font-display font-extrabold text-xl sm:text-2xl text-brand-600 tracking-tight">
        {{ storeName() }}
      </span>
    </a>

    <nav class="hidden sm:flex items-center gap-6 font-semibold text-stone-600">
      <a
        routerLink="/"
        routerLinkActive="text-brand-600"
        [routerLinkActiveOptions]="{ exact: true }"
        class="hover:text-brand-600 transition-colors"
      >
        Catálogo
      </a>
    </nav>

    <a
      routerLink="/carrito"
      class="relative flex items-center gap-2 bg-brand-500 hover:bg-brand-600 active:bg-brand-700 text-white font-bold py-2 px-4 rounded-full transition-colors shadow-sm"
    >
      <span aria-hidden="true">🛒</span>
      <span class="hidden xs:inline">Carrito</span>
      @if (totalItems() > 0) {
        <span
          class="absolute -top-2 -right-2 bg-accent-500 text-white text-xs font-bold rounded-full h-5 min-w-5 px-1 flex items-center justify-center"
        >
          {{ totalItems() }}
        </span>
      }
    </a>
  </div>
</header>
