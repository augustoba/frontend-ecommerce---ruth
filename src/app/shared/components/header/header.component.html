<header class="sticky top-0 z-30 bg-white/90 dark:bg-stone-900/90 backdrop-blur border-b border-brand-100 dark:border-stone-700 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
    <a routerLink="/" class="flex items-center gap-2 shrink-0">
      <img [src]="logoSrc() | cldImg: 96" [alt]="storeName()" class="h-11 w-11 rounded-full object-cover ring-1 ring-brand-100" />
      <span class="font-display font-extrabold text-xl sm:text-2xl text-brand-600 dark:text-brand-400 tracking-tight">
        {{ storeName() }}
      </span>
    </a>

    <nav class="hidden sm:flex items-center gap-6 font-semibold text-stone-600 dark:text-stone-300">
      <a
        href="/"
        (click)="goToCatalog($event)"
        [class.text-brand-600]="onHome()"
        class="hover:text-brand-600 dark:hover:text-brand-400 transition-colors"
      >
        Catálogo
      </a>
    </nav>

    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="themeMode.toggle()"
        [attr.aria-label]="themeMode.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        [attr.title]="themeMode.isDark() ? 'Modo claro' : 'Modo oscuro'"
        class="h-10 w-10 flex items-center justify-center rounded-full ring-1 ring-brand-100 dark:ring-stone-700 text-lg hover:bg-brand-50 dark:hover:bg-stone-800 transition-colors"
      >
        {{ themeMode.isDark() ? '☀️' : '🌙' }}
      </button>

      <a
        routerLink="/carrito"
        class="relative flex items-center gap-2 bg-brand-500 hover:bg-brand-600 active:bg-brand-700 text-white font-bold py-2 px-4 rounded-full transition-colors shadow-sm"
      >
        <span aria-hidden="true">🛒</span>
        <span class="hidden xs:inline">Carrito</span>
        @if (totalItems() > 0) {
          <span
            class="absolute -top-2 -right-2 bg-accent-500 text-white text-xs font-bold rounded-full h-5 min-w-5 px-1 flex items-center justify-center"
          >
            {{ totalItems() }}
          </span>
        }
      </a>
    </div>
  </div>
</header>
