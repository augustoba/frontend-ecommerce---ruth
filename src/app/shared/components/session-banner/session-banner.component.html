@if (visible()) {
  <div class="w-full bg-stone-900 text-stone-100 text-xs sm:text-sm px-4 py-2 flex items-center justify-center gap-3 flex-wrap text-center">
    <span>
      🔐 Conectado como <strong class="text-white">{{ displayName() }}</strong>
      @if (roleName()) { <span class="text-stone-400">· {{ roleName() }}</span> }
    </span>
    <a routerLink="/admin" class="underline decoration-stone-500 hover:text-brand-300 font-semibold">Ir al panel</a>
    <button type="button" (click)="logout()" class="underline decoration-stone-500 hover:text-red-300 font-semibold">
      Salir
    </button>
  </div>
}
