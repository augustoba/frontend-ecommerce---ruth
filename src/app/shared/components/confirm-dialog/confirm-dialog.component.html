@if (pending(); as p) {
  <div class="fixed inset-0 z-[100] bg-stone-900/50 flex items-center justify-center p-4"
    (click)="cancel()">
    <div class="bg-white rounded-2xl shadow-xl ring-1 ring-black/10 w-full max-w-sm p-6" (click)="$event.stopPropagation()">
      @if (p.title) {
        <h2 class="font-display font-extrabold text-lg text-stone-800 mb-1">{{ p.title }}</h2>
      }
      <p class="text-sm text-stone-600 whitespace-pre-line">{{ p.message }}</p>

      @if (p.input) {
        <label class="block text-xs font-semibold text-stone-500 mt-4 mb-1">{{ p.input.label }}</label>
        <input [type]="p.input.type ?? 'text'" [placeholder]="p.input.placeholder ?? ''"
          [ngModel]="inputValue()" (ngModelChange)="inputValue.set($event)"
          (keydown.enter)="accept()"
          class="w-full rounded-lg border border-stone-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400"
          autofocus />
      }

      <div class="flex justify-end gap-2 mt-5">
        <button type="button" (click)="cancel()"
          class="px-4 py-2 rounded-full text-sm font-semibold text-stone-500 hover:bg-stone-100 transition-colors">
          {{ cancelLabel() }}
        </button>
        <button type="button" (click)="accept()"
          class="px-4 py-2 rounded-full text-sm font-bold text-white transition-colors"
          [class.bg-red-500]="p.danger" [class.hover:bg-red-600]="p.danger"
          [class.bg-brand-500]="!p.danger" [class.hover:bg-brand-600]="!p.danger">
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
