@if (slides().length) {
<div class="relative w-full h-full overflow-hidden">
  <div
    class="flex h-full transition-transform duration-700 ease-out"
    [style.width.%]="slides().length * 100"
    [style.transform]="'translateX(-' + currentIndex() * (100 / slides().length) + '%)'"
  >
    @for (slide of slides(); track $index) {
      <img
        [src]="slide.imageUrl"
        [alt]="slide.alt"
        class="h-full object-cover shrink-0"
        [style.width.%]="100 / slides().length"
      />
    }
  </div>

  @if (slides().length > 1) {
    <button
      type="button"
      (click)="prev()"
      aria-label="Imagen anterior"
      class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/80 hover:bg-white text-stone-700 flex items-center justify-center shadow transition-colors"
    >
      ‹
    </button>
    <button
      type="button"
      (click)="next()"
      aria-label="Siguiente imagen"
      class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/80 hover:bg-white text-stone-700 flex items-center justify-center shadow transition-colors"
    >
      ›
    </button>

    <div class="absolute bottom-3 left-0 right-0 flex justify-center gap-2">
      @for (slide of slides(); track $index; let i = $index) {
        <button
          type="button"
          (click)="goTo(i)"
          [attr.aria-label]="'Ir a la imagen ' + (i + 1)"
          [class]="currentIndex() === i ? 'bg-white w-6' : 'bg-white/50 w-2.5'"
          class="h-2.5 rounded-full transition-all"
        ></button>
      }
    </div>
  }
</div>
}
