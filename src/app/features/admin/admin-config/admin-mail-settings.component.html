<div class="mb-4">
  <h1 class="font-display font-extrabold text-2xl text-stone-800">Servicio de mail</h1>
  <p class="text-sm text-stone-500 mt-1">
    Credenciales SMTP que se usan para mandar los mails de campañas. Sólo vos (superadmin) podés verlas y cambiarlas.
  </p>
</div>

<div class="bg-white rounded-2xl ring-1 ring-black/5 p-5 max-w-lg">
  @if (status() === 'loading') {
    <p class="text-sm text-stone-400">Cargando…</p>
  } @else {
    <div class="grid sm:grid-cols-2 gap-4">
      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-stone-500 mb-1">Servidor SMTP</label>
        <input type="text" [ngModel]="host()" (ngModelChange)="host.set($event)"
          placeholder="smtp-relay.brevo.com"
          class="w-full rounded-lg border border-stone-200 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-stone-500 mb-1">Puerto</label>
        <input type="number" [ngModel]="port()" (ngModelChange)="port.set($event)"
          class="w-full rounded-lg border border-stone-200 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-stone-500 mb-1">Usuario</label>
        <input type="text" [ngModel]="username()" (ngModelChange)="username.set($event)"
          class="w-full rounded-lg border border-stone-200 px-3 py-2 text-sm" />
      </div>
      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-stone-500 mb-1">Clave SMTP</label>
        <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)"
          placeholder="••••••••"
          class="w-full rounded-lg border border-stone-200 px-3 py-2 text-sm" />
        <p class="text-xs text-stone-400 mt-1">{{ passwordHint() }}</p>
      </div>
      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-stone-500 mb-1">Email remitente</label>
        <input type="email" [ngModel]="fromAddress()" (ngModelChange)="fromAddress.set($event)"
          placeholder="no-responder@tuecommerce.com"
          class="w-full rounded-lg border border-stone-200 px-3 py-2 text-sm" />
      </div>
    </div>

    @if (error()) {
      <p class="text-sm text-red-500 font-semibold mt-4">{{ error() }}</p>
    }

    <button type="button" (click)="save()" [disabled]="saving()"
      class="mt-5 bg-brand-500 hover:bg-brand-600 disabled:bg-stone-300 text-white font-bold py-2.5 px-6 rounded-full transition-colors text-sm">
      {{ saving() ? 'Guardando…' : 'Guardar' }}
    </button>
  }
</div>
