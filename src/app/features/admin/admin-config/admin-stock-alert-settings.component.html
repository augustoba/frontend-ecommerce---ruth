<div class="mb-4">
  <h1 class="font-display font-extrabold text-2xl text-stone-800">Alertas de stock bajo</h1>
  <p class="text-sm text-stone-500 mt-1">
    Un mail diario (7 AM) con los talles que quedaron por debajo del umbral de reposición, para no
    depender de mirar el panel todos los días.
  </p>
</div>

<div class="bg-white rounded-2xl ring-1 ring-black/5 p-5 max-w-lg">
  @if (!loaded()) {
    <p class="text-sm text-stone-400">Cargando…</p>
  } @else {
    <label class="flex items-center gap-2 mb-3">
      <input type="checkbox" class="w-4 h-4 accent-brand-500"
        [ngModel]="enabled()" [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="enabled.set($event)" />
      <span class="text-sm font-semibold text-stone-700">Mandar la alerta diaria</span>
    </label>

    <label class="block text-xs font-semibold text-stone-500 mb-1">Email de destino</label>
    <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)"
      placeholder="dueño@tutienda.com"
      class="w-full rounded-lg border border-stone-200 px-3 py-2 text-sm" />

    @if (error()) {
      <p class="text-sm text-red-500 font-semibold mt-4">{{ error() }}</p>
    }

    <button type="button" (click)="save()" [disabled]="saving()"
      class="mt-5 bg-brand-500 hover:bg-brand-600 disabled:bg-stone-300 text-white font-bold py-2.5 px-6 rounded-full transition-colors text-sm">
      {{ saving() ? 'Guardando…' : 'Guardar' }}
    </button>
  }
</div>

<a routerLink="/admin/dashboard" class="inline-block mt-4 text-sm text-stone-400 hover:text-stone-600">
  ← Ver los talles por reponer ahora en el Dashboard
</a>
