<h1 class="font-display font-extrabold text-2xl text-stone-800 mb-2">Configuración del sitio</h1>
<p class="text-sm text-stone-500 mb-6 max-w-2xl">
  Todo lo que cambia cómo se ve y se lee tu tienda. Los cambios se aplican al
  instante, sin redesplegar nada. Elegí qué querés editar:
</p>

<div class="grid gap-4 sm:grid-cols-2 max-w-3xl">
  @for (c of cards; track c.path) {
    <a [routerLink]="c.path"
      class="bg-white rounded-2xl ring-1 ring-black/5 p-5 hover:ring-brand-300 transition-colors flex gap-4">
      <span class="text-2xl shrink-0" aria-hidden="true">{{ c.icon }}</span>
      <span class="min-w-0">
        <span class="block font-display font-bold text-stone-800">{{ c.title }}</span>
        <span class="block text-sm text-stone-600 mt-0.5">{{ c.desc }}</span>
        <span class="block text-xs text-stone-400 mt-1.5">Se ve en: {{ c.where }}</span>
      </span>
    </a>
  }
</div>
