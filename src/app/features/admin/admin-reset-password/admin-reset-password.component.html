<section class="min-h-screen flex items-center justify-center bg-brand-50 px-4">
  <form
    (ngSubmit)="submit()"
    class="w-full max-w-sm bg-white rounded-2xl shadow-sm ring-1 ring-black/5 p-8"
  >
    <div class="text-center mb-5">
      <img [src]="logoSrc() | cldImg: 120" alt="Logo" class="h-14 w-14 rounded-full object-cover mx-auto ring-1 ring-brand-100 bg-white" />
      <h1 class="font-display font-extrabold text-xl text-stone-800 mt-2">Elegir contraseña nueva</h1>
    </div>

    @if (!token) {
      <p class="text-sm text-red-500 font-semibold text-center">
        Este link no es válido. Pedí uno nuevo desde "¿Olvidaste tu contraseña?".
      </p>
    } @else if (done()) {
      <p class="text-sm text-stone-600 text-center">
        Listo, tu contraseña se cambió. Ya podés entrar con ella.
      </p>
    } @else {
      <label class="block text-sm font-semibold text-stone-700 mb-1.5" for="np">Contraseña nueva</label>
      <input id="np" type="password" required name="np" autocomplete="new-password"
        [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)"
        class="w-full rounded-lg border border-stone-200 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />

      <label class="block text-sm font-semibold text-stone-700 mt-4 mb-1.5" for="cp">Repetila</label>
      <input id="cp" type="password" required name="cp" autocomplete="new-password"
        [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)"
        class="w-full rounded-lg border border-stone-200 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />

      @if (error()) {
        <p class="text-sm text-red-500 font-semibold mt-3">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full mt-6 bg-brand-500 hover:bg-brand-600 disabled:bg-stone-300 disabled:cursor-wait text-white font-bold py-2.5 rounded-full transition-colors"
      >
        {{ loading() ? 'Guardando…' : 'Cambiar contraseña' }}
      </button>
    }

    <a routerLink="/admin/login" class="block text-center text-sm text-stone-400 hover:text-stone-600 mt-4">
      ← Volver al login
    </a>
  </form>
</section>
