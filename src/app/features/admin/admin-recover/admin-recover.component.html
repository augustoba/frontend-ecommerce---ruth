<section class="min-h-screen flex items-center justify-center bg-brand-50 px-4">
  <form
    (ngSubmit)="submit()"
    class="w-full max-w-sm bg-white rounded-2xl shadow-sm ring-1 ring-black/5 p-8"
  >
    <div class="text-center mb-5">
      <img [src]="logoSrc()" alt="Estilos Pequeños" class="h-14 w-14 rounded-full object-cover mx-auto ring-1 ring-brand-100 bg-white" />
      <h1 class="font-display font-extrabold text-xl text-stone-800 mt-2">Recuperar contraseña</h1>
      <p class="text-xs text-stone-500 mt-1">
        Ingresá tu usuario y la <strong>frase de recuperación</strong> para poner una contraseña nueva.
      </p>
    </div>

    <label class="block text-sm font-semibold text-stone-700 mb-1.5" for="ru">Usuario</label>
    <input id="ru" type="text" required name="ru"
      [ngModel]="username()" (ngModelChange)="username.set($event)"
      class="w-full rounded-lg border border-stone-200 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 mb-4" />

    <label class="block text-sm font-semibold text-stone-700 mb-1.5" for="rp">Frase de recuperación</label>
    <input id="rp" type="text" required name="rp"
      [ngModel]="phrase()" (ngModelChange)="phrase.set($event)"
      class="w-full rounded-lg border border-stone-200 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 mb-4" />

    <label class="block text-sm font-semibold text-stone-700 mb-1.5" for="rn">Contraseña nueva</label>
    <input id="rn" type="password" required name="rn"
      [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)"
      class="w-full rounded-lg border border-stone-200 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 mb-4" />

    <label class="block text-sm font-semibold text-stone-700 mb-1.5" for="rn2">Repetí la contraseña nueva</label>
    <input id="rn2" type="password" required name="rn2"
      [ngModel]="newPassword2()" (ngModelChange)="newPassword2.set($event)"
      class="w-full rounded-lg border border-stone-200 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />

    @if (error()) {
      <p class="text-sm text-red-500 font-semibold mt-3">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="w-full mt-6 bg-brand-500 hover:bg-brand-600 disabled:bg-stone-300 disabled:cursor-wait text-white font-bold py-2.5 rounded-full transition-colors"
    >
      {{ loading() ? 'Guardando…' : 'Cambiar la contraseña' }}
    </button>

    <a routerLink="/admin/login" class="block text-center text-sm text-stone-400 hover:text-stone-600 mt-4">
      ← Volver al login
    </a>
  </form>
</section>
