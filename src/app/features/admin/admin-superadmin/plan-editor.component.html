<div class="bg-white rounded-2xl ring-1 ring-black/5 p-6 max-w-2xl">
  <div class="flex items-start justify-between gap-4 mb-4">
    <div>
      <p class="text-xs font-mono text-stone-400">{{ plan().slug }}</p>
      <input
        type="text"
        [ngModel]="name()"
        (ngModelChange)="setName($event)"
        class="font-display font-bold text-lg text-stone-800 border-b border-transparent hover:border-stone-200 focus:border-brand-400 focus:outline-none -ml-0.5 px-0.5"
      />
    </div>
    <span class="text-xs font-semibold text-stone-400 whitespace-nowrap mt-1">
      {{ plan().tenantCount }} {{ plan().tenantCount === 1 ? 'tienda' : 'tiendas' }}
    </span>
  </div>

  <div class="grid grid-cols-2 gap-4 mb-5">
    <div>
      <label class="block text-xs font-semibold text-stone-500 mb-1" for="mp">Máx. productos</label>
      <input
        id="mp" type="number" min="0" placeholder="Sin límite"
        [ngModel]="maxProducts()" (ngModelChange)="setMaxProducts($event)"
        class="w-full rounded-lg border border-stone-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400"
      />
    </div>
    <div>
      <label class="block text-xs font-semibold text-stone-500 mb-1" for="mu">Máx. usuarios del panel</label>
      <input
        id="mu" type="number" min="0" placeholder="Sin límite"
        [ngModel]="maxAdminUsers()" (ngModelChange)="setMaxAdminUsers($event)"
        class="w-full rounded-lg border border-stone-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400"
      />
    </div>
  </div>

  <p class="text-xs font-semibold text-stone-500 mb-2">Módulos habilitados</p>
  <div class="space-y-2 mb-5">
    @for (m of moduleOptions; track m.key) {
      <label class="flex items-start gap-2.5 rounded-lg p-2 -ml-2 hover:bg-stone-50 cursor-pointer">
        <input
          type="checkbox"
          [checked]="hasModule(m.key)"
          (change)="toggleModule(m.key)"
          class="mt-0.5 w-4 h-4 accent-brand-500"
        />
        <span>
          <span class="block text-sm font-semibold text-stone-700">{{ m.label }}</span>
          <span class="block text-xs text-stone-400">{{ m.description }}</span>
        </span>
      </label>
    }
  </div>

  <label class="flex items-center gap-2.5 mb-6 cursor-pointer">
    <input
      type="checkbox"
      [checked]="showPlatformBranding()"
      (change)="setShowPlatformBranding(!showPlatformBranding())"
      class="w-4 h-4 accent-brand-500"
    />
    <span class="text-sm font-semibold text-stone-700">Mostrar "powered by" de la plataforma en el sitio</span>
  </label>

  <button
    type="button"
    (click)="save()"
    [disabled]="!dirty() || saving() || !name().trim()"
    class="bg-brand-500 hover:bg-brand-600 disabled:bg-stone-300 disabled:cursor-not-allowed text-white font-bold py-2.5 px-6 rounded-full transition-colors text-sm"
  >
    {{ saving() ? 'Guardando…' : 'Guardar cambios' }}
  </button>
</div>
