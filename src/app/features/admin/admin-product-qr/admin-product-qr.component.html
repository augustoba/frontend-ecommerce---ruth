@if (product; as product) {
  <app-admin-label-sheet [name]="product.name" [imageSrc]="qrDataUrl()" [imageAlt]="'QR ' + product.name"
    [sizes]="sizes" initialSizeId="mediana" />
} @else {
  <div class="text-center py-20 text-stone-400">
    <p class="font-semibold">No encontramos ese producto.</p>
    <a routerLink="/admin/productos" class="mt-3 inline-block text-brand-600 font-semibold hover:underline">Volver a productos</a>
  </div>
}
