<div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" (click)="close()">
  <div class="bg-white rounded-2xl overflow-hidden max-w-sm w-full" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between px-4 py-3 border-b border-stone-100">
      <p class="font-bold text-stone-800">Escanear QR del producto</p>
      <button type="button" (click)="close()" class="text-stone-400 hover:text-red-500 text-xl leading-none">×</button>
    </div>

    <div class="bg-black aspect-square flex items-center justify-center">
      <video #video class="w-full h-full object-cover" muted playsinline></video>
    </div>

    <div class="p-4">
      @if (error()) {
        <p class="text-sm text-red-600 font-semibold">{{ error() }}</p>
      } @else {
        <p class="text-sm text-stone-500">Apuntá la cámara al QR pegado en el estante del producto.</p>
      }
    </div>
  </div>
</div>
